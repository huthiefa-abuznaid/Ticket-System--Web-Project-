    <main>
        <h1>Submit Phone Repair & Service Request</h1>

        <form action="http://fakhalil.studentprojects.ritaj.ps/util/process.php" method="post" >
            <label for="full-name">Full Name:</label><br>
            <input type="text" id="full-name" name="full_name" placeholder="Enter your full name" required><br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

            <label for="location">Location Room Number:</label><br>
            <input type="text" id="location" name="location" placeholder="Enter the room number" required><br><br>

            <label for="issue">Phone Issue Description:</label><br>
            <textarea id="issue" name="issue_description" placeholder="Describe the issue" rows="2" cols="20" required></textarea><br><br>

            <label for="urgency">Urgency Level:</label><br>
            <select id="urgency" name="urgency_level">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select><br><br>

            <label for="photo">Upload a photo of the phone/issue (optional):</label><br>
            <input type="file" id="photo" name="issue_photo" accept="image/*"><br><br>

            <button type="submit">Submit Request</button>
           
        </form>
    </main>
